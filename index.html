async function ouvrir(jeton){
  const e=new TextEncoder();
  const k0=await crypto.subtle.importKey("raw",e.encode(jeton),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},k,b64(D.c)));

async function essayer(jeton,silencieux){
  try{const page=await ouvrir(jeton);try{localStorage.setItem("cl-jeton",jeton)}catch(_){}

  catch(_){try{localStorage.removeItem("cl-jeton")}catch(_){}if(!silencieux)document.getElementById("err").textContent="Jeton incorrect.";}
}
